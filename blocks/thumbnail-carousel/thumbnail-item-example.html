<!-- This is an example of how to use the thumbnail-item component -->
<!-- This component is meant to be used inside a thumbnail-carousel block -->

<!-- Example 1: Basic thumbnail item with image -->
<div class="thumbnail-item">
  <div>
    <picture>
      <img src="/path/to/image.jpg" alt="Thumbnail description">
    </picture>
  </div>
</div>

<!-- Example 2: Thumbnail item with alt text -->
<div class="thumbnail-item">
  <div>
    <picture>
      <img src="/path/to/image.jpg" alt="Detailed thumbnail description for accessibility">
    </picture>
  </div>
</div>

<!-- Note: When used in AEM, the thumbnail-item component will be automatically 
     added to the thumbnail-carousel component when using the "+" button in the editor. -->
