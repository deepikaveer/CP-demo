<!-- This is an example of how to use the thumbnail-carousel block -->
<!-- The block will display a main image with thumbnail navigation -->
<!-- Each row with an image will be included in the carousel -->

<!-- Example 1: Default configuration -->
<div class="thumbnail-carousel">
  <!-- Configuration rows (optional) -->
  <div>
    <div>Style</div>
    <div>default</div>
  </div>
  <div>
    <div>Navigation Position</div>
    <div>bottom-right</div>
  </div>
  
  <!-- Content rows (images) -->
  <div>
    <div>
      <picture>
        <img src="/path/to/image1.jpg" alt="Image 1 description">
      </picture>
    </div>
  </div>
  <div>
    <div>
      <picture>
        <img src="/path/to/image2.jpg" alt="Image 2 description">
      </picture>
    </div>
  </div>
  <div>
    <div>
      <picture>
        <img src="/path/to/image3.jpg" alt="Image 3 description">
      </picture>
    </div>
  </div>
  <div>
    <div>
      <picture>
        <img src="/path/to/image4.jpg" alt="Image 4 description">
      </picture>
    </div>
  </div>
  <div>
    <div>
      <picture>
        <img src="/path/to/image5.jpg" alt="Image 5 description">
      </picture>
    </div>
  </div>
</div>
